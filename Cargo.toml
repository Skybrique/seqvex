[package]
name = "seqvex"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A Rust-native machine learning and reinforcement learning framework for sequential, non-IID, and streaming workloads."
license = "Apache-2.0"
repository = "https://github.com/Skybrique/seqvex"
readme = "README.md"

[workspace]
resolver = "3"

[dependencies]
rand = { version = "0.10", default-features = false, features = ["std", "chacha", "sys_rng"] }
faer = { version = "=0.24.4", default-features = false, features = ["std", "linalg"] }
sha2 = "0.10"

[[bench]]
name = "numerical"
harness = false

[[bench]]
name = "gru"
harness = false

[dev-dependencies]
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
csv = "1.4"

[[test]]
name = "linear_regression"
path = "src/models/linear/ols/tests/public_contract.rs"

[[test]]
name = "ols_oracle"
path = "src/models/linear/ols/tests/oracle.rs"

[[test]]
name = "ols_fit"
path = "src/models/linear/ols/tests/fitting.rs"

[[test]]
name = "ols_artifact"
path = "src/models/linear/ols/tests/ols_artifact.rs"

[[test]]
name = "ols_checked"
path = "src/models/linear/ols/tests/checked_serving.rs"

[[test]]
name = "ols_temporal"
path = "src/models/linear/ols/tests/ols_temporal.rs"

[[test]]
name = "rls"
path = "src/models/linear/rls/tests/rls.rs"

[[example]]
name = "ols_predict"
path = "src/models/linear/ols/examples/predict.rs"

[[example]]
name = "fit_salary"
path = "src/models/linear/ols/examples/fit_salary.rs"

[[example]]
name = "rls_learn"
path = "src/models/linear/rls/examples/rls_learn.rs"

[[example]]
name = "rls_trump_approval"
path = "src/models/linear/rls/examples/rls_trump_approval.rs"

[[bench]]
name = "ols_fit"
path = "src/models/linear/ols/benches/fit.rs"
harness = false

[[bench]]
name = "linear_regression"
path = "src/models/linear/ols/benches/execution.rs"
harness = false

[[bench]]
name = "rls"
path = "src/models/linear/rls/benches/rls.rs"
harness = false

[[bench]]
name = "decision_tree"
harness = false

[[bench]]
name = "knn"
harness = false