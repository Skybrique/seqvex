name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fmt:
    name: rust-fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  test:
    name: rust-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

  clippy:
    name: rust-clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  msrv:
    name: rust-msrv
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust 1.85.1
        uses: dtolnay/rust-toolchain@1.85.1

      - name: Verify the declared Rust 1.85 compiler line
        run: cargo test --locked --all-targets --all-features

  whitespace:
    name: diff-check
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check whitespace and conflict markers in committed changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA...$HEAD_SHA"
          else
            # A branch's first push has an all-zero before SHA.
            if [[ "$BASE_SHA" =~ ^0+$ ]]; then
              BASE_SHA="$(git merge-base "origin/$DEFAULT_BRANCH" "$HEAD_SHA")"
            fi
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          fi
